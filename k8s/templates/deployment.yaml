# Deployment: gerencia os pods da aplicação
# Garante que o número desejado de réplicas esteja sempre rodando
# Gerencia atualizações rolling (substitui pods gradualmente sem downtime)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telemetry-intake-api.fullname" . }}
  labels: {{- include "telemetry-intake-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "telemetry-intake-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels: {{- include "telemetry-intake-api.selectorLabels" . | nindent 8 }}
    spec:
      # ServiceAccount com IRSA permite acesso ao AWS Secrets Manager
      serviceAccountName: {{ include "telemetry-intake-api.serviceAccountName" . }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          env:
            - name: ASPNETCORE_URLS
              value: {{ .Values.env.ASPNETCORE_URLS | quote }}
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.env.ASPNETCORE_ENVIRONMENT | quote }}
            - name: AWS__Region
              value: {{ .Values.env.AWS__Region | quote }}

            # Secrets sensíveis injetados do Kubernetes Secret
            # (sincronizado do AWS Secrets Manager via External Secrets Operator)
            - name: SQS__QueueUrl
              valueFrom:
                secretKeyRef:
                  name: {{ include "telemetry-intake-api.fullname" . }}-secrets
                  key: sqsQueueUrl

            # Cognito config (extraido do JSON secret)
            - name: COGNITO_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ include "telemetry-intake-api.fullname" . }}-secrets
                  key: cognitoRegion
            - name: COGNITO_USER_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "telemetry-intake-api.fullname" . }}-secrets
                  key: cognitoUserPoolId
            - name: COGNITO_M2M_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "telemetry-intake-api.fullname" . }}-secrets
                  key: cognitoClientId
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.env.OTEL_SERVICE_NAME | quote }}
            - name: OTEL_DOTNET_AUTO_TRACES_ADDITIONAL_SOURCES
              value: {{ .Values.env.OTEL_DOTNET_AUTO_TRACES_ADDITIONAL_SOURCES | quote }}
            # OTEL para CloudWatch Agent DaemonSet (Application Signals)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}                                     
                                          
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
